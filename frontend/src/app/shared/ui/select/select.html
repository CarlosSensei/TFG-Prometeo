<div class="form-field">
  @if (label()) {
    <label class="form-label" [for]="id()">
      {{ label() }}
    </label>
  }

  <select
    class="form-control"
    [id]="id()"
    [value]="value()"
    [disabled]="disabled()"
    (change)="onChange($event)">

    @for (option of options(); track option.value) {
      <option [value]="option.value">
        {{ option.label }}
      </option>
    }
  </select>
</div>
