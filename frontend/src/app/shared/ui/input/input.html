<div class="form-field">
  @if (label()) {
    <label class="form-label" [for]="id()">
      {{ label() }}
      @if (required()) {
        <span class="required">*</span>
      }
    </label>
  }

  <input
    [id]="id()"
    [type]="type()"
    [placeholder]="placeholder()"
    [value]="internalValue()"
    [disabled]="disabled() || formDisabled()"
    [required]="required()"
    [attr.aria-invalid]="error() ? 'true' : null"
    [attr.aria-describedby]="error() ? id() + '-error' : null"
    (input)="onInput($event)"
    (blur)="onBlur()"
  />

  @if (error()) {
    <span class="form-error" [id]="id() + '-help'">
      {{ error() }}
    </span>
  } @else if (hint()) {
    <span class="form-hint" [id]="id() + '-help'">
      {{ hint() }}
    </span>
  }
</div>
