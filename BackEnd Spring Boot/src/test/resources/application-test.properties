# Base de datos independiente para tests
spring.datasource.url=jdbc:h2:mem:optiflow_test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Crear tablas a partir de las entidades actuales
spring.jpa.hibernate.ddl-auto=create-drop

# No ejecutar data.sql
spring.sql.init.mode=never

# Desactivar Open Session in View
spring.jpa.open-in-view=false