<div class="app-layout">

  @if (sidebarOpen()) {
    <button
      type="button"
      class="sidebar-overlay"
      aria-label="Cerrar menú"
      (click)="closeSidebar()">
    </button>
  }

  <aside class="sidebar" [class.sidebar-open]="sidebarOpen()">

    <a class="brand" routerLink="/dashboard"
       (click)="closeSidebar()">
      <span class="brand-logo">O</span>
      <span>OptiFlow</span>
    </a>

    <nav class="navigation" aria-label="Navegación principal">

      <span class="nav-section">GENERAL</span>

      <a routerLink="/dashboard"
         routerLinkActive="active"
         (click)="closeSidebar()">
        <span>◫</span> Dashboard
      </a>

      <span class="nav-section">GESTIÓN COMERCIAL</span>

      <a routerLink="/clients" routerLinkActive="active"
        (click)="closeSidebar()"><span>♙</span>Clientes</a>
      <span class="nav-placeholder">▤ &nbsp; Presupuestos</span>
      <span class="nav-placeholder">▣ &nbsp; Pedidos</span>

      <span class="nav-section">OPERACIONES</span>

      <span class="nav-placeholder">◷ &nbsp; Seguimientos</span>
      <span class="nav-placeholder">◇ &nbsp; Inventario</span>

    </nav>

    <div class="sidebar-footer">

      <div class="avatar">
        {{ auth.initials() }}
      </div>

      <div class="user-info">
        <strong>{{ auth.fullName() }}</strong>
        <small>{{ auth.user()?.role }}</small>
      </div>

      <button
        type="button"
        class="logout-button"
        aria-label="Cerrar sesión"
        title="Cerrar sesión"
        (click)="logout()">
        Salir
      </button>

    </div>

  </aside>

  <div class="main-wrapper">

    <header class="topbar">
      <div class="topbar-left">
        <button
          type="button"
          class="menu-button"
          aria-label="Abrir menú"
          (click)="toggleSidebar()">
          ☰
        </button>
        <span class="workspace-name">Workspace / OptiFlow</span>
      </div>

      <div class="topbar-right">
        <span class="environment-label">Desarrollo</span>
        <span class="topbar-avatar">{{ auth.initials() }}</span>
      </div>
    </header>

    <main class="page-content">
      <router-outlet />
    </main>

  </div>
</div>
