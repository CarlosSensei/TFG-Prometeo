<section class="quotes-page">
  <!-- CABECERA -->

  <header class="page-header">
    <div class="page-heading">
      <p class="eyebrow">GESTIÓN COMERCIAL</p>

      <h1>Presupuestos</h1>

      <p class="page-description">
        Consulta y realiza el seguimiento de los presupuestos de tu óptica.
      </p>
    </div>

    <div class="header-actions">
      <app-badge variant="info"> {{ totalElements() }} presupuestos </app-badge>

      <app-button variant="primary" (pressed)="createQuote()">
        + Nuevo presupuesto
      </app-button>
    </div>
  </header>

  <!-- ERROR -->

  @if (error()) {
    <div class="error-panel" role="alert">
      <p>{{ error() }}</p>

      <app-button variant="secondary" size="sm" (pressed)="retry()">
        Reintentar
      </app-button>
    </div>
  }

  <!-- TABLA -->

  <app-quote-table
    [quotes]="quotes()"
    [loading]="loading()"
    [filters]="filters()"
    [sort]="sort()"
    [page]="page()"
    [pageSize]="pageSize"
    [totalElements]="totalElements()"
    (filtersCleared)="clearAllFilters()"
    (filterChanged)="handleFilterChange($event)"
    (sortChanged)="changeSort($event)"
    (rowAction)="handleRowAction($event)"
    (pageChanged)="changePage($event)"
  />

  <!-- FICHA DEL PRESUPUESTO -->

  <app-quote-detail-drawer
    [quoteId]="selectedQuoteId()"
    (closed)="closeQuoteDetail()"
    (clientRequested)="openClientDetail($event)"
    (editRequested)="editQuote($event)"
  />
</section>
