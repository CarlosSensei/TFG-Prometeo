<div class="lookup-field">
  <label for="inventory-query"> Añadir artículo </label>

  <div class="lookup-controls">
    <input
      id="inventory-query"
      type="search"
      placeholder="Buscar artículo por nombre"
      [value]="inventoryQuery()"
      (input)="updateInventoryQuery($any($event.target).value)"
    />

    <app-button
      variant="secondary"
      type="button"
      [disabled]="inventoryQuery().trim().length < 2 || searchingInventory()"
      (pressed)="searchInventory()"
    >
      Buscar
    </app-button>
  </div>

  @if (searchingInventory()) {
    <small role="status">Buscando artículos...</small>
  }
  @if (inventoryResults().length > 0) {
    <div class="lookup-results">
      @for (item of inventoryResults(); track item.id) {
        <button type="button" class="lookup-result" (click)="addItem(item)">
          <span>
            <strong>{{ item.name }}</strong>
            <small> {{ item.sku }} · Stock: {{ item.stock }} </small>
          </span>

          <strong>
            {{ item.salePrice | currency: "EUR" : "symbol" : "1.2-2" }}
          </strong>
        </button>
      }
    </div>
  }
</div>
