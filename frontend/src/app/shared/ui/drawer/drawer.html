<dialog
  #dialog
  class="ui-drawer"
  [class.ui-drawer--wide]="size() === 'wide'"
  aria-modal="true"
  aria-labelledby="drawer-title"
  (close)="onDialogClose()"
>
  <div class="drawer-layout">

    <header class="drawer-header">
      <h2 id="drawer-title">{{ title() }}</h2>

      <button
        type="button"
        class="drawer-close"
        aria-label="Cerrar panel"
        title="Cerrar panel"
        (click)="close()"
      >
        <svg
          viewBox="0 0 24 24"
          width="20"
          height="20"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          aria-hidden="true"
        >
          <path d="M18 6 6 18M6 6l12 12" />
        </svg>
      </button>
    </header>

    <div class="drawer-content">
      <ng-content />
    </div>

  </div>
</dialog>
