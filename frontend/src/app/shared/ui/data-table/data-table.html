<app-table-active-filters
  [columns]="columns()"
  [filters]="filters()"
  (filterRemoved)="filterChange.emit({ key: $event, value: {} })"
/>

<div class="table-container">
  <div class="table-scroll" (scroll)="closeFilter()">
    <table class="ui-table">
      <thead
        appTableHeader
        [columns]="columns()"
        [filters]="filters()"
        [sort]="sort()"
        [openFilter]="openFilter()"
        (sortChange)="sortChange.emit($event)"
        (filterRequested)="toggleFilter($event.column, $event.event)"
      ></thead>
      <tbody
        appTableBody
        [columns]="columns()"
        [rows]="rows()"
        [loading]="loading()"
        [emptyMessage]="emptyMessage()"
        (rowSelected)="rowSelected.emit($event)"
        (rowAction)="rowAction.emit($event)"
      ></tbody>
    </table>
  </div>
</div>

@if (currentColumn(); as column) {
  @if (column.filter) {
    <div
      appTableFilterPanel
      class="column-filter-panel"
      [column]="column"
      [value]="filters()[column.key] ?? {}"
      [style.top.px]="panelPosition().top"
      [style.left.px]="panelPosition().left"
      (applied)="applyFilter($event)"
      (cleared)="applyFilter({})"
      (closed)="closeFilter()"
    ></div>
  }
}
