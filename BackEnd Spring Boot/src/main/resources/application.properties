# ===============================
# APPLICATION
# ===============================

spring.application.name=optiflow-crm

# =================================
# SERVIDOR - DEMO LOCAL TFG
# =================================

server.address=127.0.0.1
server.port=8080

# ===============================
# H2 DATABASE
# ===============================

spring.datasource.url=jdbc:h2:file:./data/optiflow
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Consola H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console


# ===============================
# JPA / HIBERNATE
# ===============================

# Recrear estructura en cada arranque
spring.jpa.hibernate.ddl-auto=create

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Recargar datos de demostración
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# ===============================
# JWT
# ===============================

app.jwt.secret=${JWT_SECRET:OptiFlow-CRM-2026-JWT-SuperSecure-Key-9fK7xQ2mL8vN4zR1pT6yW3cB5dH0sA}

# 1 hora
app.jwt.expiration=3600


# ===============================
# SWAGGER / OPENAPI
# ===============================

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html


# ===============================
# LOGGING
# ===============================

logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG